site_name: leapt/core-bundle
site_description: Documentation for leapt/core-bundle

repo_name: leapt/core-bundle
repo_url: https://github.com/leapt/core-bundle
edit_uri: https://github.com/leapt/core-bundle/edit/6.x/docs/

theme:
    name: material
    language: en
    features:
        - navigation.instant
        - navigation.top
        - toc.integrate
    palette:
        -   scheme: default
            primary: green
            media: "(prefers-color-scheme: light)"
            toggle:
                icon: material/weather-night
                name: Switch to dark mode
        -   scheme: slate
            primary: green
            media: "(prefers-color-scheme: dark)"
            toggle:
                icon: material/weather-sunny
                name: Switch to light mode

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/leapt/core-bundle
          name: leapt/core-bundle repository
    generator: false

plugins:
    - search: { }

nav:
    - index.md
    - form_types.md
    - file_uploads.md
    - honeypot.md
    - messenger.md
    - paginator.md
    - Data lists:
        - Overview: data_lists.md
        - Custom data list: data_lists/custom_data_list.md
        - Fields:
            - Label field: data_lists/field/label_field.md
            - Common options: data_lists/field/common_options.md
    - rss_feeds.md
    - sitemaps.md
    - navigation_helper.md
    - utilities.md
    - validators.md
    - twig_extensions.md
    - configuration_reference.md

markdown_extensions:
    - toc:
        permalink: '#'
    - pymdownx.details: { }
    - pymdownx.inlinehilite: { }
    - pymdownx.highlight:
        extend_pygments_lang:
            - { name: php, lang: php, options: { startinline: true } }
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true
    - admonition: { }

